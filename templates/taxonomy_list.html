{% extends "base.html" %}

{% block title %}{{ taxonomy.name | capitalize }} · {{ config.title }}{% endblock title %}

{% block content %}
<h1>{{ taxonomy.name | capitalize }}</h1>
<ul class="term-list">
  {% for term in terms %}
  <li><a href="{{ term.permalink }}">{{ term.name }}</a> <span class="term-count">({{ term.pages | length }})</span></li>
  {% endfor %}
</ul>
{% endblock content %}
