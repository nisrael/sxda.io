{% extends "base.html" %}

{% block title %}Page not found · {{ config.title }}{% endblock title %}

{% block content %}
<div class="not-found" data-pagefind-ignore>
  <h1>404</h1>
  <p>There's nothing here. The page may have moved, or never existed.</p>
  <p><a href="{{ get_url(path="/") }}">Back to the homepage</a></p>
</div>
{% endblock content %}
