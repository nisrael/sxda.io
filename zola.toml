base_url = "https://sxda.io"
title = "sxda.io"
description = "Some notes about the things I do, which may include hiking, programming, analog synth, Catan, tinkering, puzzles and rogue li[kt]es besides other interesting stuff."

default_language = "en"
author = "Nils Israel"
preserve_dotfiles_in_output = true

compile_sass = false
generate_feeds = true
# Named "feed.xml" (with templates/feed.xml providing the Atom template) to
# keep the feed URL subscribers already have from the old Jekyll/jekyll-feed setup.
feed_filenames = ["feed.xml"]

taxonomies = [{ name = "tags", feed = true }]

[markdown]
smart_punctuation = true
bottom_footnotes = true
insert_anchor_links = "right"
github_alerts = true

[markdown.highlighting]
style = "inline"
light_theme = "github-light"
dark_theme = "Carbonfox"
extra_themes = ["extra/carbonfox-dark-theme.json"]

